<div class="card-no-hover quick-notes-card" id="quick-notes-container">
  <h3 class="section-title-with-icon" style="color: var(--deep-forest); display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.06);">
    📝 {{ t('quick_notes_title', 'Farm Quick Notes') }}
  </h3>

  <p class="quick-notes-subtext" style="font-size: 12.5px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5;">
    {{ t('quick_notes_prompt', 'What do you need to buy?') }}
  </p>

  <!-- Add Note Input form -->
  <div class="quick-note-add-row" style="display: flex; gap: 8px; margin-bottom: 16px;">
    <input type="text" id="quick-note-input" class="input-field" placeholder="{{ t('quick_notes_placeholder', 'Buy NPK fertilizer...') }}" style="flex: 1; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(111,175,123,0.25); font-size: 13px;" />
    <button type="button" id="quick-note-add-btn" class="btn btn-primary" style="height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 8px;">+</button>
  </div>

  <!-- Checklist scroll body -->
  <div id="quick-notes-list" class="quick-notes-list" style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;">
    <!-- Populated dynamically via JS -->
    <div style="text-align: center; color: var(--text-secondary); font-size: 13px; padding: 16px 0;">
      ⏳ Loading your quick notes...
    </div>
  </div>

  <!-- Clear control button -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.06);">
    <span id="quick-notes-count" style="font-size: 12px; color: var(--text-secondary); font-weight: 500;">
      0 items
    </span>
    <button type="button" id="quick-notes-clear-btn" class="btn btn-sm btn-outline" style="color: var(--red-alert) !important; border-color: rgba(230,106,106,0.3) !important;">
      {{ t('clear_completed', 'Clear Completed') }}
    </button>
  </div>
</div>
