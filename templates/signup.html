{% extends "base.html" %}

{% block title %}Sign Up — AgriMitra AI{% endblock %}

{% block body %}
<div class="split-layout page-transition">
  <!-- Left: Farm Image -->
  <div class="split-image">
    <img src="{{ url_for('static', filename='images/signup-farm.png') }}" alt="Farm Landscape" />
    <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(40, 89, 67, 0.15) 0%, transparent 100%);"></div>
  </div>

  <!-- Right: Sign Up Form -->
  <div class="split-form">
    <div class="form-container">
      <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>

      <h2>Create Your<br>AgriMitra AI Account 🌿</h2>
      <p class="form-subtitle">Join the future of smart farming with AI.</p>

      <form method="POST" action="{{ url_for('auth.signup') }}">
        <div class="form-fields">
          <div class="input-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" name="name" class="input-field" placeholder="Enter your full name" required />
          </div>

          <div class="input-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" name="email" class="input-field" placeholder="Enter your email" required />
          </div>

          <div class="input-group">
            <label for="signup-password">Password</label>
            <div class="input-password-wrapper">
              <input type="password" id="signup-password" name="password" class="input-field" placeholder="Create a password" required />
              <button class="toggle-password" type="button" aria-label="Toggle password visibility" data-target="signup-password">👁</button>
            </div>
          </div>

          <div class="input-group">
            <label for="signup-confirm">Confirm Password</label>
            <div class="input-password-wrapper">
              <input type="password" id="signup-confirm" name="confirm_password" class="input-field" placeholder="Confirm your password" required />
              <button class="toggle-password" type="button" aria-label="Toggle password visibility" data-target="signup-confirm">👁</button>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="signup-terms" required />
            <label for="signup-terms">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button class="btn btn-primary btn-lg" type="submit" style="width: 100%; margin-top: 8px;" id="signup-btn">
            Sign Up
          </button>

          <p class="form-footer">
            Already have an account? <a href="{{ url_for('auth.signin') }}">Sign In</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      if (target) {
        target.type = target.type === 'password' ? 'text' : 'password';
        btn.textContent = target.type === 'password' ? '👁' : '👁‍🗨';
      }
    });
  });
</script>
{% endblock %}
